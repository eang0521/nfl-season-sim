name: Update NFL data

on:
  schedule:
    # Every 2 hours on NFL game days (Thu, Sun, Mon), covering kickoff through
    # late games. Cron is UTC; NFL games run roughly 17:00-04:00 UTC.
    - cron: '0 17-23/2 * * 0,1,4'
    - cron: '0 0-4/2 * * 1,2,5'
    # Once a day otherwise, to pick up FPI movement and schedule changes.
    - cron: '0 12 * * 2,3,5,6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch FPI ratings, schedule, score distribution, and Elo games
        run: npm run fetch:all

      - name: Recompute all-time Elo ratings
        run: npm run compute:elo

      - name: Re-run FPI/Elo predictors if new games completed or ratings changed
        run: node scripts/maybe-run-predictor.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "No data changes." || git commit -m "Update NFL data [automated]"
          git push

